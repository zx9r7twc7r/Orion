# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# =====================================================
# 2026-10-14 本机工具链修（不改任何编译产物语义，只解决"命令行编不了"）
# =====================================================
# 症状：命令行 gradlew 报
#   Toolchain installation 'D:\GTX\daemon\9.6.0' does not provide the required
#   capabilities: [JAVA_COMPILER]
# 机制：本工程 `it.options.release = 25`（MC 26.3 要求 Java 25），而 Gradle 只自动
# 探测到 JAVA_HOME=D:\ 的 **JDK 21** ⇒ 不满足 ⇒ 走 Auto-download（离线 ⇒ 失败），
# 并在守候目录 D:\GTX\daemon\9.6.0 留下空壳，被当成"工具链安装"。
# 本机真 JDK 26 在 D:\RTX（IDE 里注册名 openjdk-26，Oracle OpenJDK 26.0.2）。
# ⚠ Gradle 的工具链匹配是**版本严格相等**：工程要 25，而 D:\RTX 是 26 ⇒ 仍配不上
#   （IntelliJ 不受此限，它自己调 javac 26 + --release 25）。所以这里保留路径登记、
#   并**打开 auto-download**，让 Gradle 自行下载一个正牌的 JDK 25 到
#   %GRADLE_USER_HOME%/jdks（本机即 D:\GTX\jdks）。若离线环境，改回手动装 JDK 25
#   并把 paths 指向它。
# ⚠ 换机器：删掉下面三行即可恢复默认。
# 2026-10-18：命令行 gradlew 报 "supplied javaHome ... D:\GTX\daemon\9.6.0\bin\java.exe"
# 的原因是本机 **JAVA_HOME 为空**，Gradle 回退把 GRADLE_USER_HOME 下的 daemon 目录当 JDK。
# 这里显式指定 daemon 使用的 JVM，命令行就不必再手设 JAVA_HOME。
org.gradle.java.home=D:/RTX

org.gradle.java.installations.paths=D:/RTX
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
mod_version=beta-0.42
maven_group=com.example

# Dependencies
fabric_api_version=0.160.6+26.3
